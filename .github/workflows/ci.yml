name: CI

# The trigger ROADMAP Phase 6 asked for. tools/run-smoke-tests.sh has been a
# one-command entry point that exits nonzero for several phases; what was
# missing was anything that ran it other than a person remembering to.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first - there is no value in
# finishing a run against a commit nobody will look at again. main is excluded
# from cancellation because its runs are the record of what actually landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Must match Hollowdeck.csproj's Godot.NET.Sdk version and project.godot's
  # config/features. PixelSpecSmokeTest and friends run against the engine, so
  # a mismatch here is a real difference from what the developer sees.
  GODOT_VERSION: 4.7.1-stable
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    # The full sweep is well under a minute locally; the per-suite watchdog in
    # run-smoke-tests.sh caps a hung suite at 90s. This is the outer bound for
    # the download and import on a cold cache.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Download/cache/$GODOT lives in a composite action because the export
      # job below needs the identical four steps - see
      # .github/actions/setup-godot/action.yml.
      - uses: ./.github/actions/setup-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Version check
        run: |
          "$GODOT" --headless --version
          dotnet --version
          cargo --version

      - name: Build
        run: dotnet build -v q --nologo

      # .godot/ is gitignored, so a fresh checkout has no imported resources at
      # all and every ResourceLoader.Exists() returns false. Without this,
      # PixelSpecSmokeTest fails on assets that are sitting right there - which
      # is exactly how it failed locally the first time a new icon was
      # generated and not re-imported.
      #
      # Run twice on purpose: the first pass generates .godot/ and the import
      # metadata, and a cold project can still be resolving dependencies at the
      # end of it. The second is a no-op when the first was complete.
      - name: Import assets
        run: |
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --import

      - name: Smoke tests
        run: tools/run-smoke-tests.sh

      # Redundant with run-smoke-tests.sh, which runs these first, and worth a
      # step of its own anyway: a red step named "artgen tests" says what broke,
      # where the same failure inside the script above says only "smoke tests".
      # These are the assertions about ART_SPEC §10's light direction, which is
      # the one rule in this repo that neither the compiler nor `validate` can
      # hold - a highlight on the wrong side of a blade is on-ramp, on-grid and
      # hard-alpha, so every byte-level check passes it.
      #
      # --release deliberately: the two `cargo run --release` steps below share
      # this target directory, so the test binary reuses their dependency
      # artifacts instead of paying for a second full build.
      - name: artgen tests
        run: cargo test --release --manifest-path tools/artgen/Cargo.toml

      # artgen's output is committed, so it can drift from its source: edit an
      # icon's fn, forget to re-run, and the repo ships art that no longer
      # matches the code that claims to produce it. Generation is pure, so
      # regenerating must be a no-op.
      #
      # ALL THREE output directories, and the ones after the first are the whole
      # point of this comment. `generate` writes the eight icon categories into
      # assets/icons/, the `chrome` category into assets/theme/ and the
      # `backgrounds` category into assets/backgrounds/ (main::output_dir),
      # because 9-slices are on the 16/24 grids and floor tiles on the 64x64
      # one rather than 32x32, so each has to sit somewhere
      # validate::expected_grid reads differently. This step diffed
      # only assets/icons from the day chrome landed, so every one of the
      # fourteen slices was outside the check - while three places said in the
      # present tense that it was covered: CLAUDE.md's chrome section,
      # PIXEL_ART_ROADMAP.md section 2, and output_dir's own docstring, which
      # gives keeping chrome inside plain `generate` rather than behind a
      # subcommand as the reason CI still sees it. It did not.
      #
      # Anything that teaches `generate` a third output directory has to be
      # added here too. There is no way to ask artgen where it writes, which is
      # what makes this list the thing to check rather than the thing to trust.
      - name: Generated art is up to date
        run: |
          cargo run --release --quiet --manifest-path tools/artgen/Cargo.toml -- generate
          if ! git diff --exit-code -- assets/icons assets/theme assets/backgrounds; then
            echo "::error::assets/icons, assets/theme or assets/backgrounds differs from what tools/artgen generates." \
                 "Run 'cargo run --release --manifest-path tools/artgen/Cargo.toml -- generate' and commit the result."
            exit 1
          fi

      # Same argument one asset class over. The sprite frames are *derived* from
      # the sourced roster, so they drift two ways: edit a derivation in
      # anim.rs, or re-clamp a source sprite, and the committed frames stop
      # matching what produces them. Deriving is pure, so this must be a no-op.
      - name: Derived sprite frames are up to date
        run: |
          cargo run --release --quiet --manifest-path tools/artgen/Cargo.toml -- animate
          if ! git diff --exit-code -- assets/sprites/anim; then
            echo "::error::assets/sprites/anim differs from what tools/artgen derives." \
                 "Run 'cargo run --release --manifest-path tools/artgen/Cargo.toml -- animate' and commit the result."
            exit 1
          fi

  # A separate job rather than more steps on `smoke`, because it needs ~1.1GB of
  # export templates that the test job must never pay for. In parallel it costs
  # no wall clock on a warm cache, and a red job named "Export" says what broke.
  #
  # It gates PRs on the same triggers as `smoke`. CI budget is a real
  # counter-argument and this job is the expensive one - but this is the single
  # bug class in the project that is structurally invisible to every other
  # check. It does not exist in the editor (res:// there IS the source tree), no
  # smoke suite runs against a .pck, and an unhandled C# exception does not move
  # an exit code. This file's own header says the gap CI closed was "anything
  # that ran it other than a person remembering to"; a main-only gate would
  # reintroduce exactly that, for the failure with the worst blast radius - a
  # shipped build with no content.
  #
  # Linux only. The pack contents are what is under test and they are
  # platform-independent; adding Windows and macOS triples the dotnet publish
  # cross-compile for no extra signal. The one thing a Linux-only boot cannot
  # see - a Windows preset whose include_filter drifted - is covered by the grep
  # at the top of tools/build-export.sh, which runs on every platform.
  export:
    name: Export
    runs-on: ubuntu-latest
    # Two dotnet publish runs and a ~1.1GB template download on a cold cache.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: ./.github/actions/setup-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          export-templates: 'true'

      # Same reason as the smoke job: .godot/ is gitignored, so a fresh checkout
      # resolves no resources at all.
      - name: Import assets
        run: |
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --import

      # Exports build/linux/, copies CREDITS.md beside it, then boots the real
      # binary headlessly and fails on any ERROR line. That boot is the only
      # check in this repo that runs against a .pck rather than a source tree,
      # and it is the only thing that can see a content JSON missing from it.
      - name: Export and boot
        run: tools/build-export.sh Linux

      # Only from main - a downloadable build is for handing to a playtester,
      # and every PR producing one is noise. tar'd first because
      # upload-artifact rezips and drops the executable bit (every file becomes
      # 644), which would make the download unrunnable without a chmod nobody
      # would guess at.
      - name: Package artifact
        if: github.event_name == 'push'
        run: tar czf hollowdeck-linux.tar.gz -C build/linux .

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: hollowdeck-linux-${{ github.sha }}
          path: hollowdeck-linux.tar.gz
          retention-days: 14
