; Godot rewrites this file whenever the export dialog is touched. It is
; committed anyway, for three reasons:
;
;   1. CI physically cannot export without it - --export-release resolves a
;      preset by *name* out of this file and errors out if the file is absent.
;   2. Nothing in it is secret. Every option Godot flags PROPERTY_USAGE_SECRET
;      - codesign passwords, certificate files, notarization credentials, the
;      script encryption key - is written to .godot/export_credentials.cfg
;      instead, and .godot/ is already gitignored.
;   3. It is what decides which files reach a build, which makes it part of how
;      this project ships rather than a local preference - and an untracked file
;      is not where that belongs.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Identical on all three presets, and belt-and-braces rather than load-bearing -
; which was worth measuring rather than assuming. Godot 4 loads .json through a
; built-in resource loader, so "all_resources" already packs the six content
; files under data/ on its own; blanking this line and re-exporting produces a
; byte-identical .pck. Kept anyway, for two reasons: it states the intent
; ("everything under data/ ships") instead of depending on how Godot happens to
; classify an extension, and it is what a data file with a *non*-resource
; extension would need - a data/foo.txt is verifiably NOT packed without a
; filter that matches it.
;
; Anchored to data/ rather than a bare "*.json": Godot's glob crosses '/', and
; the export walk skips only .godot/, dot-directories and .gdignore dirs - so
; "*.json" would also pack several hundred Cargo fingerprint files out of
; tools/artgen/target/.
include_filter="data/*.json"
exclude_filter=""
export_path="build/linux/Hollowdeck.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
export DISPLAY=:0
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
kill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")
rm -rf \"{temp_dir}\""
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false

