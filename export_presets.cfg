application/export_d3d12=0
display/high_res=true
; 3 = Apple's own codesign, NOT 1 (Godot's built-in ad-hoc signer). This was
; found by running the build, not by reading docs: 1 produces a signature that
; `codesign -vvv` calls valid and that AMFI then refuses, logging "failed
; parsing DER entitlements", and the kernel SIGKILLs the process on launch. No
; stdout, no crash report, exit 137 - which is precisely the kind of failure the
; boot check in tools/build-export.sh exists to catch, and it caught this one.
;
; With codesign/identity left empty, 3 ad-hoc signs through Apple's tool and the
; result runs. The cost is that this preset now needs a macOS host with the
; Xcode command line tools, so macOS cannot be exported from the Linux CI
; runner - which CI does not do anyway (it exports Linux; see ci.yml).
;
; Ad-hoc satisfies the arm64 loader but NOT Gatekeeper: a .zip downloaded from
; anywhere arrives with com.apple.quarantine and macOS 15 removed the
; Control-click bypass. See README.md - this is not a notarized build and is not
; pretending to be.
codesign/codesign=3
codesign/installer_identity=""
codesign/apple_team_id=""
codesign/identity=""
codesign/entitlements/custom_file=""
codesign/entitlements/allow_jit_code_execution=false
