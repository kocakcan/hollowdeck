custom_template/release=""
; 2 = always. Windows is the only platform where a player has no stdout by
; default, which makes "run Hollowdeck.console.exe and paste what it says" the
; difference between a usable bug report and a screenshot of a frozen window.
; The default is 1 (debug builds only), which is exactly backwards for that.
